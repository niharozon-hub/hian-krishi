<main class="main"><header class="topbar"><div class="tb-l"><button class="hamb" id="hamb" aria-label="মেনু"><i class="fas fa-bars"></i></button><h1 class="tb-title" id="pageTitle">ড্যাশবোর্ড</h1></div><div class="tb-r"><button class="sync-btn synced" id="syncBtn" onclick="manualSync()"><i class="fas fa-cloud"></i><span>সিঙ্ক</span></button><div class="dt-box"><i class="far fa-calendar-alt"></i><span class="dt-d" id="dtDate"></span><span class="dt-s">|</span><span class="dt-t" id="dtTime"></span></div><button class="tb-btn" id="notifBtn" aria-label="নোটিফিকেশন"><i class="far fa-bell"></i><span class="nd"></span></button><button class="lo-btn" id="loBtn"><i class="fas fa-sign-out-alt"></i><span>লগআউট</span></button></div></header><div id="pgDashboard" class="page act"></div><div id="pgProducts" class="page"></div><div id="pgStocks" class="page"></div><div id="pgCustomers" class="page"></div><div id="pgDealers" class="page"></div><div id="pgSummary" class="page"></div></main>

<script>
/* ═══════════════ ইউটিলিটি ═══════════════ */
var SYNC_URL='https://script.google.com/macros/s/AKfycbwb-JJp52BJ__NwC_K__guABGdXWme5xx2lbPVWGWapwJYXF-hwWvPI56gSXVNsIoQS/exec';
var BN=['০','১','২','৩','৪','৫','৬','৭','৮','৯'],BNM={'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
var MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function toBn(n){return String(n).replace(/[0-9]/g,function(d){return BN[+d]})}
function toEn(s){return String(s).replace(/[০-৯]/g,function(d){return BNM[d]||d})}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function autoDate(){var d=new Date();return toBn(String(d.getDate()).padStart(2,'0'))+'/'+toBn(String(d.getMonth()+1).padStart(2,'0'))+'/'+toBn(d.getFullYear())}
function autoDateFull(){var d=new Date();return toBn(d.getDate())+' '+MONTHS[d.getMonth()]+' '+toBn(d.getFullYear())+', '+['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'][d.getDay()]+'বার'}
function autoTime(){var h=new Date().getHours(),m=new Date().getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;return toBn(String(h).padStart(2,'0'))+':'+toBn(String(m).padStart(2,'0'))+' '+ap}
function nextInv(n){return'SI-'+String(n).padStart(6,'0')}
function parseDate(s){var p=String(s).split('/');if(p.length!==3)return null;return{day:parseInt(toEn(p[0])),month:parseInt(toEn(p[1]))-1,year:parseInt(toEn(p[2]))}}
function isDIM(ds,m,y){var d=parseDate(ds);return d&&d.month===m&&d.year===y}

/* ═══════════════ হিসাব ═══════════════ */
function calcDue(c){return (c.prevDue||0)+c.transactions.reduce(function(s,t){return s+(t.type==='invoice'?t.due:0)-(t.type==='deposit'?t.paid:0)},0)}
function calcDD(d){return d.transactions.reduce(function(s,t){return s+(t.challanNo==='পেমেন্ট'?-t.paid:t.due)},0)}
function totalAllDue(){return DB.customers.reduce(function(s,c){return s+calcDue(c)},0)}
function totalDD(){return DB.dealers.reduce(function(s,d){return s+calcDD(d)},0)}
function getTE(){var td=autoDate();var e=DB.expenses.find(function(x){return x.date===td});if(!e){e={date:td,purchase:0,home:0,shop:0};DB.expenses.push(e)}return e}
function getTTC(){var e=getTE();var dp=DB.dealers.reduce(function(s,d){return s+d.transactions.filter(function(t){return t.challanNo==='পেমেন্ট'&&t.date===autoDate()}).reduce(function(sm,t){return sm+t.paid},0)},0);return e.purchase+e.home+e.shop+dp}
function getCS(ds){var cs=DB.cashSales.filter(function(c){return c.date===ds}).reduce(function(s,c){return s+(c.total!=null?c.total:c.products.reduce(function(sm,p){return sm+p.qty*p.price},0))},0);var dp=DB.customers.reduce(function(s,c){return s+c.transactions.filter(function(t){return t.type==='invoice'&&t.date===ds}).reduce(function(sm,t){return sm+t.paid},0)},0);return cs+dp}
function getCRS(ds){return DB.customers.reduce(function(s,c){return s+c.transactions.filter(function(t){return t.type==='invoice'&&t.date===ds}).reduce(function(sm,t){return sm+t.due},0)},0)}
function getTTS(){return getCS(autoDate())+getCRS(autoDate())}
function getProfit(ds){var p=0;DB.cashSales.filter(function(c){return c.date===ds}).forEach(function(c){var d=c.discount||0;c.products.forEach(function(x){var pr=DB.products.find(function(q){return q.id===x.pid});if(pr)p+=(x.price-pr.buyPrice)*x.qty});p-=d});DB.customers.forEach(function(c){c.transactions.forEach(function(t){if(t.type==='invoice'&&t.date===ds){t.products.forEach(function(x){var pr=DB.products.find(function(q){return q.name===x.name});if(pr)p+=(x.price-pr.buyPrice)*x.qty})}})});return p}
function getTP(){return getProfit(autoDate())}
function getMD(m,y){var cs=0,cr=0,pf=0,pc=0,oe=0;DB.cashSales.forEach(function(c){if(isDIM(c.date,m,y)){cs+=(c.total!=null?c.total:c.products.reduce(function(s,p){return s+p.qty*p.price},0));var d=c.discount||0;c.products.forEach(function(p){var pr=DB.products.find(function(x){return x.id===p.pid});if(pr)pf+=(p.price-pr.buyPrice)*p.qty});pf-=d}});DB.customers.forEach(function(c){c.transactions.forEach(function(t){if(!isDIM(t.date,m,y))return;if(t.type==='invoice'){cr+=t.totalBill;t.products.forEach(function(p){var pr=DB.products.find(function(x){return x.name===p.name});if(pr)pf+=(p.price-pr.buyPrice)*p.qty})}})});DB.expenses.forEach(function(e){if(isDIM(e.date,m,y)){pc+=e.purchase;oe+=e.home+e.shop}});DB.dealers.forEach(function(d){d.transactions.forEach(function(t){if(t.challanNo==='পেমেন্ট'&&isDIM(t.date,m,y)){pc+=t.paid}})});return{cs:cs,cr:cr,ts:cs+cr,pf:pf,pc:pc,oe:oe,tc:pc+oe}}
function getDD(ds){var cs=DB.cashSales.filter(function(c){return c.date===ds}).reduce(function(s,c){return s+(c.total!=null?c.total:c.products.reduce(function(sm,p){return sm+p.qty*p.price},0))},0);var ip=0,cr=0,pf=0;DB.cashSales.filter(function(c){return c.date===ds}).forEach(function(c){var d=c.discount||0;c.products.forEach(function(p){var pr=DB.products.find(function(x){return x.id===p.pid});if(pr)pf+=(p.price-pr.buyPrice)*p.qty});pf-=d});DB.customers.forEach(function(c){c.transactions.forEach(function(t){if(t.type==='invoice'&&t.date===ds){ip+=t.paid;cr+=t.due;t.products.forEach(function(p){var pr=DB.products.find(function(x){return x.name===p.name});if(pr)pf+=(p.price-pr.buyPrice)*p.qty})}})});var pc=0,oe=0;DB.expenses.forEach(function(e){if(e.date===ds){pc+=e.purchase;oe+=e.home+e.shop}});DB.dealers.forEach(function(d){d.transactions.forEach(function(t){if(t.challanNo==='পেমেন্ট'&&t.date===ds){pc+=t.paid}})});return{cs:cs+ip,cr:cr,pf:pf,pc:pc,oe:oe,tc:pc+oe}}
/* ═══════════════ ডাটাবেস ═══════════════ */
var DEF={products:[{id:1,name:'তাকাদ ১০০ মিলি',buyPrice:280,sellPrice:350,stock:20},{id:2,name:'তাকাদ ৫০ মিলি',buyPrice:150,sellPrice:200,stock:1},{id:3,name:'কোজেব ১০০ গ্রাম',buyPrice:85,sellPrice:120,stock:50},{id:4,name:'কোজেব ৫০০ গ্রাম',buyPrice:350,sellPrice:500,stock:2}],customers:[{id:1,name:'রহিম উদ্দিন',phone:'01712345678',address:'বাজারপাড়া',transactions:[{date:autoDate(),invoiceNo:'SI-000001',totalBill:4000,paid:2000,due:2000,type:'invoice',products:[{name:'তাকাদ ১০০ মিলি',qty:2,price:350},{name:'কোজেব ১০০ গ্রাম',qty:5,price:120},{name:'কোজেব ৫০০ গ্রাম',qty:4,price:500}]},{date:autoDate(),invoiceNo:'জমা',totalBill:0,paid:1000,due:0,type:'deposit',products:[]}]},{id:2,name:'করিম শেখ',phone:'01898765432',address:'পূর্বপাড়া',transactions:[]}],dealers:[{id:1,name:'ইউনিয়ন এগ্রো',transactions:[{date:'01/06/2026',challanNo:'560',totalBill:80000,paid:30000,due:50000},{date:'05/06/2026',challanNo:'561',totalBill:25000,paid:25000,due:0}]},{id:2,name:'সাকসেস এগ্রো',transactions:[{date:'15/05/2026',challanNo:'540',totalBill:90000,paid:0,due:90000}]}],expenses:[],cashSales:[],nxtPid:5,nxtCid:3,nxtDid:3,nxtInv:2,nxtCh:562};
var GN=['আব্দুল্লাহ','আহমেদ','বাবুল','চাঁদ মিয়া','দুলাল','ফজলু','গোলাম','হাবিব','ইব্রাহিম','জাহিদ','কামাল','লুৎফর','মনির','নজরুল','ওয়াহিদ','পিয়ার','কাশেম','রশিদ','সোলায়মান','তাহের','উজ্জ্বল','বেলাল','নাসির','মাসুদ','হানিফ','রফিক','শফিক','আলী','রহমান','করিম'];
var rd=43000,gn=3;for(var i=0;i<83&&rd>0;i++){var a=i<78?500:800;if(a>rd)break;DEF.customers.push({id:gn,name:GN[i%30]+' '+toBn(gn),phone:'01XXXXXXXXX',address:'ঠিকানা',transactions:[{date:'15/05/2026',invoiceNo:nextInv(DEF.nxtInv),totalBill:a,paid:0,due:a,type:'invoice',products:[]}]});DEF.nxtInv++;rd-=a;gn++}DEF.nxtCid=gn;

function loadLocal(){try{var s=localStorage.getItem('hianDB');if(s){var d=JSON.parse(s);if(!Array.isArray(d.expenses))d.expenses=[];if(!Array.isArray(d.cashSales))d.cashSales=[];if(!d.nxtPid)d.nxtPid=1;if(!d.nxtCid)d.nxtCid=1;if(!d.nxtDid)d.nxtDid=1;if(!d.nxtInv)d.nxtInv=1;if(!d.nxtCh)d.nxtCh=1;d.products.forEach(function(p){if(typeof p.stock==='undefined')p.stock=0});return d}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function saveLocal(){try{localStorage.setItem('hianDB',JSON.stringify(DB))}catch(e){}}
function setSS(s){var b=document.getElementById('syncBtn');if(!b)return;b.className='sync-btn '+s;if(s==='syncing')b.innerHTML='<i class="fas fa-spinner"></i><span>সিঙ্ক</span>';else b.innerHTML='<i class="fas fa-cloud"></i><span>সিঙ্ক</span>'}
function syncUp(){setSS('syncing');DB._ls=Date.now();saveLocal();fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'save',db:DB})}).then(function(r){return r.json()}).then(function(d){if(d.status==='ok'){setSS('synced')}else setSS('error')}).catch(function(){setSS('error')})}
function syncDown(cb){setSS('syncing');fetch(SYNC_URL+'?_t='+Date.now()).then(function(r){return r.json()}).then(function(d){if(d.status==='ok'&&d.db){try{var c=JSON.parse(d.db);if(!DB._ls||(c._ls&&c._ls>DB._ls)){DB=c;saveLocal();setSS('synced');if(cb)cb(true);return}}catch(e){}}setSS('synced');if(cb)cb(false)}).catch(function(){setSS('error');if(cb)cb(false)})}
function manualSync(){syncDown(function(u){if(u){toast('ok','ক্লাউড থেকে ডেটা আপডেট হয়েছে');renderDash()}else{syncUp();toast('info','ক্লাউডে আপলোড হচ্ছে')}})}
function saveDB(){saveLocal();syncUp()}
var DB=loadLocal();
syncDown(function(u){if(u)renderDash()});

/* ═══════════════ ইউআই হেল্পার ═══════════════ */
function updateDT(){document.getElementById('dtDate').textContent=autoDateFull();document.getElementById('dtTime').textContent=autoTime()}
updateDT();setInterval(updateDT,10000);
function toast(t,m){var b=document.getElementById('toastBox'),e=document.createElement('div');e.className='toast';var ic={ok:'fa-check',info:'fa-info',warn:'fa-exclamation',err:'fa-times'};e.innerHTML='<div class="t-ic '+t+'"><i class="fas '+ic[t]+'"></i></div><span>'+esc(m)+'</span>';b.appendChild(e);setTimeout(function(){e.classList.add('out');setTimeout(function(){e.remove()},250)},3000)}
function openM(id){document.getElementById(id).classList.add('show');document.body.style.overflow='hidden'}
function closeM(id){document.getElementById(id).classList.remove('show');document.body.style.overflow=''}
function setM(id,h){document.getElementById(id+'Inner').innerHTML=h}
function sCL(i,d){var inp=document.getElementById(i);if(inp)inp.addEventListener('blur',function(){setTimeout(function(){var dd=document.getElementById(d);if(dd)dd.style.display='none'},150)})}
document.getElementById('mainModal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeM('mainModal')});
document.getElementById('subModal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeM('subModal')});
document.getElementById('sub2Modal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeM('sub2Modal')});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeM('sub2Modal');closeM('subModal');closeM('mainModal')}});

/* ═══════════════ নেভিগেশন ═══════════════ */
var PT={dashboard:'ড্যাশবোর্ড',products:'পণ্য তালিকা',stocks:'পণ্য স্টক',customers:'গ্রাহক তালিকা',dealers:'কোম্পানি/ডিলার',summary:'হিসাব সারাংশ'};
function showPage(p){document.querySelectorAll('.page').forEach(function(e){e.classList.remove('act')});document.querySelectorAll('.nav-i').forEach(function(e){e.classList.remove('act')});document.getElementById('pg'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('act');document.querySelector('.nav-i[data-p="'+p+'"]').classList.add('act');document.getElementById('pageTitle').textContent=PT[p];if(p==='dashboard')renderDash();else if(p==='products')initPP();else if(p==='stocks')initSP();else if(p==='customers')initCP();else if(p==='dealers')initDP();else if(p==='summary')initSUM();document.getElementById('sidebar').classList.remove('open');document.getElementById('sbOv').style.display='none'}
document.querySelectorAll('.nav-i').forEach(function(el){function go(){showPage(el.dataset.p)}el.addEventListener('click',go);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
document.getElementById('hamb').addEventListener('click',function(){var s=document.getElementById('sidebar'),o=document.getElementById('sbOv');s.classList.toggle('open');o.style.display=s.classList.contains('open')?'block':'none'});
document.getElementById('sbOv').addEventListener('click',function(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sbOv').style.display='none'});
document.getElementById('notifBtn').addEventListener('click',function(){toast('info','কোনো নতুন নোটিফিকেশন নেই');document.querySelector('.nd').style.display='none'});
document.getElementById('loBtn').addEventListener('click',function(){toast('warn','লগআউট হচ্ছে...')});

/* ═══════════════ ড্যাশবোর্ড ═══════════════ */
function renderDash(){
var td=totalAllDue(),tc=DB.customers.length,tS=getTTS(),tC=getTTC(),tP=getTP(),tdd=totalDD();
var ls='';var lp=DB.products.filter(function(p){return p.stock<=2});
if(lp.length>0)ls='<div class="panel" style="margin-top:14px"><div class="p-head"><h3><i class="fas fa-triangle-exclamation" style="color:var(--org)"></i> কম স্টক</h3></div><div class="p-body">'+lp.map(function(p){return'<div class="low-stock-item"><span class="low-stock-name">'+esc(p.name)+'</span><span class="low-stock-val">'+toBn(p.stock)+'</span></div>'}).join('')+'</div></div>';

function sCSP(q){var dd=document.getElementById('csD');if(!dd)return;var f=q.toLowerCase(),l=DB.products.filter(function(p){return p.name.toLowerCase().includes(f)});if(!l.length){dd.style.display='none';return}dd.style.display='block';dd.innerHTML=l.map(function(p){return'<div onclick="aCSP('+p.id+')">'+esc(p.name)+' — ৳'+toBn(p.sellPrice)+' ('+toBn(p.stock)+')</div>'}).join('')}

function fC(){var f=(document.getElementById('cS')?.value||'').toLowerCase(),l=DB.customers.filter(function(c){return c.name.toLowerCase().includes(f)||c.phone.includes(f)}),tb=document.getElementById('cTb');if(!tb)return;if(!l.length){tb.innerHTML='<tr><td colspan="6" class="empty-msg">কোনো গ্রাহক নেই</td></tr>';return}tb.innerHTML=l.map(function(c,i){var d=calcDue(c);if(eCid===c.id)return'<tr><td>'+toBn(i+1)+'</td><td><input class="ed-inp" id="cn_'+c.id+'" value="'+esc(c.name)+'"></td><td><input class="ed-inp" id="cp_'+c.id+'" value="'+esc(c.phone)+'"></td><td><input class="ed-inp" id="ca_'+c.id+'" value="'+esc(c.address)+'"></td><td class="t-num" style="color:var(--red)">'+toBn(d.toFixed(2))+'</td><td><button class="ib save" onclick="sEC('+c.id+')"><i class="fas fa-save"></i></button><button class="ib cancel" onclick="eCid=null;fC()"><i class="fas fa-times"></i></button></td></tr>';return'<tr><td>'+toBn(i+1)+'</td><td><span class="t-name" onclick="oCD('+c.id+')">'+esc(c.name)+'</span></td><td>'+esc(c.phone)+'</td><td>'+esc(c.address)+'</td><td class="t-num" style="color:'+(d>0?'var(--red)':'var(--grn)')+'">৳ '+toBn(d.toFixed(2))+'</td><td><button class="ib edit" onclick="eCid='+c.id+';fC()"><i class="fas fa-pen"></i></button><button class="ib del" onclick="dC('+c.id+')"><i class="fas fa-trash"></i></button></td></tr>'}).join('')}
function sEC(id){var n=document.getElementById('cn_'+id).value.trim();if(!n){toast('warn','নাম দিন');return}if(DB.customers.some(function(c){return c.id!==id&&c.name===n})){toast('err','এই নামে আছে');return}var c=DB.customers.find(function(x){return x.id===id});if(c){c.name=n;c.phone=document.getElementById('cp_'+id).value.trim();c.address=document.getElementById('ca_'+id).value.trim()}eCid=null;saveDB();fC();toast('ok','আপডেট হয়েছে')}
function dC(id){setM('mainModal','<div class="m-head"><h3>মুছে ফেলতে চান?</h3><button class="m-x" onclick="closeM(\'mainModal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><p>গ্রাহককে মুছে ফেলতে চান?</p></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'mainModal\')">বাতিল</button><button class="mbtn mbtn-r" onclick="DB.customers=DB.customers.filter(function(c){return c.id!=='+id+'});saveDB();closeM(\'mainModal\');fC();toast(\'ok\',\'মুছে ফেলা হয়েছে\')">মুছুন</button></div>');openM('mainModal')}
function openNC(){setM('mainModal','<div class="m-head"><h3>নতুন গ্রাহক</h3><button class="m-x" onclick="closeM(\'mainModal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="fg"><label>নাম</label><input id="ncN" placeholder="নাম লিখুন"></div><div class="fg"><label>মোবাইল</label><input id="ncP" placeholder="01XXXXXXXXX"></div><div class="fg"><label>ঠিকানা</label><input id="ncA" placeholder="ঠিকানা লিখুন"></div><div class="fg"><label>পূর্বের বাকি</label><input type="number" id="ncPD" placeholder="0" min="0"></div></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'mainModal\')">বাতিল</button><button class="mbtn mbtn-gr" onclick="sNC()"><i class="fas fa-save"></i> সংরক্ষণ</button></div>');openM('mainModal')}
function sNC(){var n=document.getElementById('ncN').value.trim(),p=document.getElementById('ncP').value.trim(),a=document.getElementById('ncA').value.trim(),pd=Math.max(0,+(document.getElementById('ncPD')?.value||0));if(!n){toast('warn','নাম দিন');return}if(DB.customers.some(function(c){return c.name===n})){toast('err','এই নামে আছে');return}DB.customers.push({id:DB.nxtCid++,name:n,phone:p,address:a,prevDue:pd,transactions:[]});saveDB();closeM('mainModal');if(document.getElementById('pgCustomers').classList.contains('act'))fC();renderDash();toast('ok','গ্রাহক যোগ হয়েছে')}
/* ═══════════════ গ্রাহক বিস্তারিত ═══════════════ */
function oCD(id){var c=DB.customers.find(function(x){return x.id===id});if(!c)return;var due=calcDue(c);var h='<div class="m-head"><h3>'+esc(c.name)+'</h3><button class="m-x" onclick="closeM(\'subModal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="cust-info-bar"><span>মোবাইল: <strong>'+esc(c.phone)+'</strong></span><span>ঠিকানা: <strong>'+esc(c.address)+'</strong></span><span>বাকি: <strong class="cust-due-big">৳ '+toBn(due.toFixed(2))+'</strong></span></div><div class="action-btns"><button style="background:var(--blu)" onclick="addInvF('+c.id+')"><i class="fas fa-file-invoice"></i> নতুন চালান</button><button style="background:var(--grn)" onclick="addDepF('+c.id+')"><i class="fas fa-hand-holding-dollar"></i> জমা</button></div>';if(!c.transactions.length){h+='<p class="empty-msg">কোনো লেনদেন নেই</p>'}else{h+='<table><thead><tr><th>তারিখ</th><th>চালান</th><th>বিল</th><th>জমা</th><th>বাকি</th><th></th></tr></thead><tbody>';c.transactions.forEach(function(t,i){if(t.type==='invoice'){h+='<tr><td>'+esc(t.date)+'</td><td class="t-click" onclick="vInv('+c.id+','+i+')">'+esc(t.invoiceNo)+'</td><td class="t-num">৳ '+toBn(t.totalBill)+'</td><td class="t-num" style="color:var(--grn)">৳ '+toBn(t.paid)+'</td><td class="t-num" style="color:var(--red)">৳ '+toBn(t.due)+'</td><td><button class="ib del" onclick="delCT('+c.id+','+i+')"><i class="fas fa-trash"></i></button></td></tr>'}else if(t.type==='previous_due'){h+='<tr><td>'+esc(t.date)+'</td><td><span class="s-pill" style="background:var(--pur-l);color:var(--pur)">পূর্বের বাকি</span></td><td>—</td><td>—</td><td class="t-num" style="color:var(--red)">৳ '+toBn(t.due)+'</td><td><button class="ib del" onclick="delCT('+c.id+','+i+')"><i class="fas fa-trash"></i></button></td></tr>'}else{h+='<tr><td>'+esc(t.date)+'</td><td><span class="s-pill s-dep">জমা</span></td><td>—</td><td class="t-num" style="color:var(--grn)">৳ '+toBn(t.paid)+'</td><td>—</td><td><button class="ib del" onclick="delCT('+c.id+','+i+')"><i class="fas fa-trash"></i></button></td></tr>'}});h+='</tbody></table>'}h+='</div>';setM('subModal',h);openM('subModal')}
function vInv(cid,idx){var c=DB.customers.find(function(x){return x.id===cid});if(!c||!c.transactions[idx])return;var t=c.transactions[idx];var h='<div class="m-head"><h3>'+esc(t.invoiceNo)+'</h3><button class="m-x" onclick="closeM(\'sub2Modal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><p style="margin-bottom:10px;color:var(--ts)">গ্রাহক: <strong>'+esc(c.name)+'</strong> | তারিখ: <strong>'+esc(t.date)+'</strong></p>';if(t.products&&t.products.length){h+='<table><thead><tr><th>পণ্য</th><th>পরিমাণ</th><th>দাম</th><th>মোট</th></tr></thead><tbody>';t.products.forEach(function(p){h+='<tr><td>'+esc(p.name)+'</td><td class="t-num">'+toBn(p.qty)+'</td><td class="t-num">'+toBn(p.price)+'</td><td class="t-num">'+toBn(p.qty*p.price)+'</td></tr>'});h+='</tbody></table>'}h+='<div style="margin-top:12px"><div class="calc-row"><span>মোট বিল</span><span class="t-num">৳ '+toBn(t.totalBill)+'</span></div><div class="calc-row"><span>জমা</span><span class="t-num" style="color:var(--grn)">৳ '+toBn(t.paid)+'</span></div><div class="calc-row due"><span>বাকি</span><span>৳ '+toBn(t.due)+'</span></div></div></div>';setM('sub2Modal',h);openM('sub2Modal')}
function delCT(cid,idx){var c=DB.customers.find(function(x){return x.id===cid});if(!c)return;var t=c.transactions[idx];if(t.type==='invoice'&&t.products){t.products.forEach(function(p){var pr=DB.products.find(function(x){return x.name===p.name});if(pr)pr.stock=(pr.stock||0)+p.qty})}c.transactions.splice(idx,1);saveDB();oCD(cid);renderDash();toast('ok','লেনদেন মুছে ফেলা হয়েছে')}

/* ═══════════════ চালান তৈরি ═══════════════ */
var sII=[],sICid=0;
function openSI(){sII=[];sICid=0;setM('mainModal','<div class="m-head"><h3>নতুন চালান</h3><button class="m-x" onclick="closeM(\'mainModal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="fg" style="position:relative"><label>গ্রাহক খুঁজুন</label><input id="siC" placeholder="নাম লিখুন..." oninput="sCDD(this.value)" onfocus="sCDD(this.value)" autocomplete="off"><div id="siCD" class="cust-dd" style="display:none"></div></div><div id="siCS"></div><div class="fg" style="position:relative"><label>পণ্য খুঁজুন</label><input id="siS" placeholder="নাম লিখুন..." oninput="sSIP(this.value)" onfocus="sSIP(this.value)" autocomplete="off"><div id="siD" class="prod-dropdown" style="display:none"></div></div><button class="more-prod-btn" onclick="oMPI()"><i class="fas fa-plus"></i> আরও পণ্য</button><div id="siP"></div><div style="margin-top:14px"><div class="calc-row"><span>মোট বিল</span><span class="t-num" id="siT">৳ '+toBn(0)+'</span></div><div class="fg" style="margin-top:10px;margin-bottom:0"><label>জমা</label><input type="number" id="siPaid" value="0" min="0" oninput="cSIDue()"></div><div class="calc-row due"><span>বাকি</span><span id="siDue">৳ '+toBn(0)+'</span></div></div></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'mainModal\')">বাতিল</button><button class="mbtn mbtn-gr" onclick="sSI()"><i class="fas fa-save"></i> সংরক্ষণ</button></div>');openM('mainModal');sCL('siC','siCD');sCL('siS','siD')}
function sCDD(q){var dd=document.getElementById('siCD');if(!dd)return;var f=q.toLowerCase(),l=DB.customers.filter(function(c){return c.name.toLowerCase().includes(f)});if(!l.length){dd.style.display='none';return}dd.style.display='block';dd.innerHTML=l.map(function(c){return'<div onclick="selSIC('+c.id+')"><span>'+esc(c.name)+'</span><span class="cust-due">বাকি: ৳'+toBn(calcDue(c).toFixed(2))+'</span></div>'}).join('')}
function selSIC(id){sICid=id;var c=DB.customers.find(function(x){return x.id===id});var el=document.getElementById('siCS');if(el)el.innerHTML='<div style="padding:8px 12px;background:var(--blu-l);border-radius:6px;margin-bottom:10px;font-size:13px"><strong>'+esc(c.name)+'</strong> — '+esc(c.phone)+'</div>';var s=document.getElementById('siC');if(s)s.value='';var d=document.getElementById('siCD');if(d)d.style.display='none'}
function sSIP(q){var dd=document.getElementById('siD');if(!dd)return;if(!sICid){toast('warn','আগে গ্রাহক নির্বাচন করুন');dd.style.display='none';return}var f=q.toLowerCase(),l=DB.products.filter(function(p){return p.name.toLowerCase().includes(f)});if(!l.length){dd.style.display='none';return}dd.style.display='block';dd.innerHTML=l.map(function(p){return'<div onclick="aSIP('+p.id+')">'+esc(p.name)+' — ৳'+toBn(p.sellPrice)+' ('+toBn(p.stock)+')</div>'}).join('')}
function aSIP(pid){var p=DB.products.find(function(x){return x.id===pid});if(!p)return;if(sII.some(function(x){return x.pid===pid})){toast('warn','ইতিমধ্যে যোগ হয়েছে');return}sII.push({pid:p.id,name:p.name,buyPrice:p.buyPrice,qty:1,price:p.sellPrice});rSIP();var s=document.getElementById('siS');if(s)s.value='';var d=document.getElementById('siD');if(d)d.style.display='none'}
function oMPI(){var h='<div class="m-head"><h3>পণ্য নির্বাচন</h3><button class="m-x" onclick="closeM(\'sub2Modal\')"><i class="fas fa-times"></i></button></div><div class="m-body">';DB.products.forEach(function(p){h+='<div class="prod-list-item"><span>'+esc(p.name)+' — ৳'+toBn(p.sellPrice)+' ('+toBn(p.stock)+')</span>'+(sII.some(function(x){return x.pid===p.id})?'<span class="pl-added">যোগ হয়েছে</span>':'<button class="pl-add" onclick="aSIP('+p.id+');closeM(\'sub2Modal\');oMPI();rSIP()">যোগ</button>')+'</div>'});h+='</div>';setM('sub2Modal',h);openM('sub2Modal')}
function rSIP(){var el=document.getElementById('siP');if(!el)return;el.innerHTML='<table><thead><tr><th>পণ্য</th><th>পরিমাণ</th><th>দাম</th><th>মোট</th><th></th></tr></thead><tbody>'+sII.map(function(p,i){return'<tr><td>'+esc(p.name)+'</td><td><input class="ed-inp num" type="number" value="'+p.qty+'" min="1" onchange="sII['+i+'].qty=Math.max(1,+this.value||1);rSIP()" style="width:60px"></td><td class="t-num">'+toBn(p.price)+'</td><td class="t-num">'+toBn(p.qty*p.price)+'</td><td><button class="ib del" onclick="sII.splice('+i+',1);rSIP()"><i class="fas fa-times"></i></button></td></tr>'}).join('')+'</tbody></table>';cSIDue()}
function cSIDue(){var t=sII.reduce(function(s,p){return s+p.qty*p.price},0);var paid=Math.max(0,+(document.getElementById('siPaid')?.value||0));document.getElementById('siT').textContent='৳ '+toBn(t);document.getElementById('siDue').textContent='৳ '+toBn(Math.max(0,t-paid))}
function sSI(){if(!sICid){toast('warn','গ্রাহক নির্বাচন করুন');return}if(!sII.length){toast('warn','কমপক্ষে একটি পণ্য যোগ করুন');return}var lo=[];sII.forEach(function(x){var pr=DB.products.find(function(p){return p.id===x.pid});if(pr&&x.qty>pr.stock)lo.push(pr.name+' (চাহিদা: '+x.qty+', স্টক: '+pr.stock+')')});if(lo.length&&!confirm('স্টক পর্যাপ্ত নেই:\n'+lo.join('\n')+'\nতারপরও সংরক্ষণ করবেন?'))return;var total=sII.reduce(function(s,p){return s+p.qty*p.price},0);var paid=Math.max(0,+(document.getElementById('siPaid')?.value||0));var due=Math.max(0,total-paid);sII.forEach(function(x){var pr=DB.products.find(function(p){return p.id===x.pid});if(pr)pr.stock=Math.max(0,(pr.stock||0)-x.qty)});var c=DB.customers.find(function(x){return x.id===sICid});if(c){c.transactions.push({date:autoDate(),invoiceNo:nextInv(DB.nxtInv),totalBill:total,paid:paid,due:due,type:'invoice',products:sII.map(function(p){return{name:p.name,qty:p.qty,price:p.price}})});DB.nxtInv++}saveDB();closeM('mainModal');renderDash();toast('ok','চালান সংরক্ষিত হয়েছে')}

/* ═══════════════ গ্রাহকের থেকে চালান/জমা ═══════════════ */
var aII=[],aICid=0;
function addInvF(cid){aII=[];aICid=cid;setM('sub2Modal','<div class="m-head"><h3>নতুন চালান</h3><button class="m-x" onclick="closeM(\'sub2Modal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="fg" style="position:relative"><label>পণ্য খুঁজুন</label><input id="aIS" placeholder="নাম লিখুন..." oninput="sAIP(this.value)" onfocus="sAIP(this.value)" autocomplete="off"><div id="aID" class="prod-dropdown" style="display:none"></div></div><div id="aIP"></div><div style="margin-top:14px"><div class="calc-row"><span>মোট বিল</span><span class="t-num" id="aIT">৳ '+toBn(0)+'</span></div><div class="fg" style="margin-top:10px;margin-bottom:0"><label>জমা</label><input type="number" id="aIPaid" value="0" min="0" oninput="cAIDue()"></div><div class="calc-row due"><span>বাকি</span><span id="aIDue">৳ '+toBn(0)+'</span></div></div></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'sub2Modal\')">বাতিল</button><button class="mbtn mbtn-gr" onclick="sAInv()"><i class="fas fa-save"></i> সংরক্ষণ</button></div>');openM('sub2Modal');sCL('aIS','aID')}
function sAIP(q){var dd=document.getElementById('aID');if(!dd)return;var f=q.toLowerCase(),l=DB.products.filter(function(p){return p.name.toLowerCase().includes(f)});if(!l.length){dd.style.display='none';return}dd.style.display='block';dd.innerHTML=l.map(function(p){return'<div onclick="aAIP('+p.id+')">'+esc(p.name)+' — ৳'+toBn(p.sellPrice)+' ('+toBn(p.stock)+')</div>'}).join('')}
function aAIP(pid){var p=DB.products.find(function(x){return x.id===pid});if(!p)return;if(aII.some(function(x){return x.pid===pid})){toast('warn','ইতিমধ্যে যোগ হয়েছে');return}aII.push({pid:p.id,name:p.name,buyPrice:p.buyPrice,qty:1,price:p.sellPrice});rAIP();var s=document.getElementById('aIS');if(s)s.value='';var d=document.getElementById('aID');if(d)d.style.display='none'}
function rAIP(){var el=document.getElementById('aIP');if(!el)return;el.innerHTML='<table><thead><tr><th>পণ্য</th><th>পরিমাণ</th><th>দাম</th><th>মোট</th><th></th></tr></thead><tbody>'+aII.map(function(p,i){return'<tr><td>'+esc(p.name)+'</td><td><input class="ed-inp num" type="number" value="'+p.qty+'" min="1" onchange="aII['+i+'].qty=Math.max(1,+this.value||1);rAIP()" style="width:60px"></td><td class="t-num">'+toBn(p.price)+'</td><td class="t-num">'+toBn(p.qty*p.price)+'</td><td><button class="ib del" onclick="aII.splice('+i+',1);rAIP()"><i class="fas fa-times"></i></button></td></tr>'}).join('')+'</tbody></table>';cAIDue()}
function cAIDue(){var t=aII.reduce(function(s,p){return s+p.qty*p.price},0);var paid=Math.max(0,+(document.getElementById('aIPaid')?.value||0));document.getElementById('aIT').textContent='৳ '+toBn(t);document.getElementById('aIDue').textContent='৳ '+toBn(Math.max(0,t-paid))}
function sAInv(){if(!aII.length){toast('warn','কমপক্ষে একটি পণ্য যোগ করুন');return}var lo=[];aII.forEach(function(x){var pr=DB.products.find(function(p){return p.id===x.pid});if(pr&&x.qty>pr.stock)lo.push(pr.name+' (চাহিদা: '+x.qty+', স্টক: '+pr.stock+')')});if(lo.length&&!confirm('স্টক পর্যাপ্ত নেই:\n'+lo.join('\n')+'\nতারপরও সংরক্ষণ করবেন?'))return;var total=aII.reduce(function(s,p){return s+p.qty*p.price},0);var paid=Math.max(0,+(document.getElementById('aIPaid')?.value||0));var due=Math.max(0,total-paid);aII.forEach(function(x){var pr=DB.products.find(function(p){return p.id===x.pid});if(pr)pr.stock=Math.max(0,(pr.stock||0)-x.qty)});var c=DB.customers.find(function(x){return x.id===aICid});if(c){c.transactions.push({date:autoDate(),invoiceNo:nextInv(DB.nxtInv),totalBill:total,paid:paid,due:due,type:'invoice',products:aII.map(function(p){return{name:p.name,qty:p.qty,price:p.price}})});DB.nxtInv++}saveDB();closeM('sub2Modal');oCD(aICid);renderDash();toast('ok','চালান সংরক্ষিত হয়েছে')}
function addDepF(cid){setM('sub2Modal','<div class="m-head"><h3>জমা</h3><button class="m-x" onclick="closeM(\'sub2Modal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="fg"><label>জমার পরিমাণ</label><input type="number" id="depA" placeholder="0" min="0"></div></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'sub2Modal\')">বাতিল</button><button class="mbtn mbtn-gr" onclick="sDep('+cid+')"><i class="fas fa-save"></i> সংরক্ষণ</button></div>');openM('sub2Modal')}
function sDep(cid){var paid=Math.max(0,+(document.getElementById('depA')?.value||0));if(paid<=0){toast('warn','পরিমাণ দিন');return}var c=DB.customers.find(function(x){return x.id===cid});if(c){c.transactions.push({date:autoDate(),invoiceNo:'জমা',totalBill:0,paid:paid,due:0,type:'deposit',products:[]})}saveDB();closeM('sub2Modal');oCD(cid);renderDash();toast('ok','জমা সংরক্ষিত হয়েছে')}

/* ═══════════════ ডিলার ═══════════════ */
var eDid=null;
function initDP(){document.getElementById('pgDealers').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div></div><button class="mbtn mbtn-b" onclick="openND()"><i class="fas fa-plus"></i> নতুন ডিলার</button></div><div class="panel"><div class="p-body" style="overflow-x:auto"><table><thead><tr><th>ক্রমিক</th><th>নাম</th><th>বাকি</th><th>অ্যাকশন</th></tr></thead><tbody id="dTb"></tbody></table></div></div>';fD()}
function fD(){var f=(document.getElementById('dS')?.value||'').toLowerCase();if(!document.getElementById('dS')){var l=DB.dealers}else{l=DB.dealers.filter(function(d){return d.name.toLowerCase().includes(f)})}var tb=document.getElementById('dTb');if(!tb)return;if(!l.length){tb.innerHTML='<tr><td colspan="4" class="empty-msg">কোনো ডিলার নেই</td></tr>';return}tb.innerHTML=l.map(function(d,i){var due=calcDD(d);if(eDid===d.id)return'<tr><td>'+toBn(i+1)+'</td><td><input class="ed-inp" id="dn_'+d.id+'" value="'+esc(d.name)+'"></td><td class="t-num" style="color:var(--red)">'+toBn(due.toFixed(2))+'</td><td><button class="ib save" onclick="sED('+d.id+')"><i class="fas fa-save"></i></button><button class="ib cancel" onclick="eDid=null;fD()"><i class="fas fa-times"></i></button></td></tr>';return'<tr><td>'+toBn(i+1)+'</td><td><span class="t-name" onclick="oDD('+d.id+')">'+esc(d.name)+'</span></td><td class="t-num" style="color:'+(due>0?'var(--red)':'var(--grn)')+'">৳ '+toBn(due.toFixed(2))+'</td><td><button class="ib edit" onclick="eDid='+d.id+';fD()"><i class="fas fa-pen"></i></button><button class="ib del" onclick="dD('+d.id+')"><i class="fas fa-trash"></i></button></td></tr>'}).join('')}
function sED(id){var n=document.getElementById('dn_'+id).value.trim();if(!n){toast('warn','নাম দিন');return}if(DB.dealers.some(function(d){return d.id!==id&&d.name===n})){toast('err','এই নামে আছে');return}var d=DB.dealers.find(function(x){return x.id===id});if(d)d.name=n;eDid=null;saveDB();fD();toast('ok','আপডেট হয়েছে')}
function dD(id){setM('mainModal','<div class="m-head"><h3>মুছে ফেলতে চান?</h3><button class="m-x" onclick="closeM(\'mainModal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><p>ডিলারকে মুছে ফেলতে চান?</p></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'mainModal\')">বাতিল</button><button class="mbtn mbtn-r" onclick="DB.dealers=DB.dealers.filter(function(d){return d.id!=='+id+'});saveDB();closeM(\'mainModal\');initDP();toast(\'ok\',\'মুছে ফেলা হয়েছে\')">মুছুন</button></div>');openM('mainModal')}
function openND(){setM('mainModal','<div class="m-head"><h3>নতুন ডিলার</h3><button class="m-x" onclick="closeM(\'mainModal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="fg"><label>নাম</label><input id="ndN" placeholder="ডিলারের নাম"></div></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'mainModal\')">বাতিল</button><button class="mbtn mbtn-gr" onclick="sND()"><i class="fas fa-save"></i> সংরক্ষণ</button></div>');openM('mainModal')}
function sND(){var n=document.getElementById('ndN').value.trim();if(!n){toast('warn','নাম দিন');return}if(DB.dealers.some(function(d){return d.name===n})){toast('err','এই নামে আছে');return}DB.dealers.push({id:DB.nxtDid++,name:n,transactions:[]});saveDB();closeM('mainModal');initDP();renderDash();toast('ok','ডিলার যোগ হয়েছে')}

/* ═══════════════ ডিলার বিস্তারিত ═══════════════ */
function oDD(id){var d=DB.dealers.find(function(x){return x.id===id});if(!d)return;var due=calcDD(d);var h='<div class="m-head"><h3>'+esc(d.name)+'</h3><button class="m-x" onclick="closeM(\'subModal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="dlr-head"><div class="dlr-name">'+esc(d.name)+'</div><div class="dlr-due">বাকি: ৳ '+toBn(due.toFixed(2))+'</div></div><div class="action-btns"><button style="background:var(--blu)" onclick="addChF('+d.id+')"><i class="fas fa-file-invoice"></i> নতুন চালান</button><button style="background:var(--org)" onclick="addDPF('+d.id+')"><i class="fas fa-hand-holding-dollar"></i> পেমেন্ট</button></div>';if(!d.transactions.length){h+='<p class="empty-msg">কোনো লেনদেন নেই</p>'}else{h+='<table><thead><tr><th>তারিখ</th><th>চালান</th><th>বিল</th><th>পেমেন্ট</th><th>বাকি</th><th></th></tr></thead><tbody>';d.transactions.forEach(function(t,i){var isPay=t.challanNo==='পেমেন্ট';h+='<tr><td>'+esc(t.date)+'</td><td>'+(isPay?'<span class="s-pill s-pay">পেমেন্ট</span>':esc(t.challanNo))+'</td><td class="t-num">'+(isPay?'—':'৳ '+toBn(t.totalBill))+'</td><td class="t-num" style="color:var(--grn)">৳ '+toBn(t.paid)+'</td><td class="t-num" style="color:'+(isPay?'var(--tm)':t.due>0?'var(--red)':'var(--grn)')+'">'+(isPay?'—':'৳ '+toBn(t.due))+'</td><td><button class="ib del" onclick="delDT('+d.id+','+i+')"><i class="fas fa-trash"></i></button></td></tr>'});h+='</tbody></table>'}h+='</div>';setM('subModal',h);openM('subModal')}
function addChF(did){setM('sub2Modal','<div class="m-head"><h3>নতুন চালান</h3><button class="m-x" onclick="closeM(\'sub2Modal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="fg"><label>চালান নম্বর</label><input id="chN" value="'+toBn(DB.nxtCh)+'"></div><div class="fg"><label>মোট বিল</label><input type="number" id="chB" placeholder="0" min="0"></div><div class="fg"><label>পেমেন্ট</label><input type="number" id="chP" value="0" min="0" oninput="cChDue()"></div><div class="calc-row due"><span>বাকি</span><span id="chDue">৳ '+toBn(0)+'</span></div></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'sub2Modal\')">বাতিল</button><button class="mbtn mbtn-gr" onclick="sCh('+did+')"><i class="fas fa-save"></i> সংরক্ষণ</button></div>');openM('sub2Modal')}
function cChDue(){var b=Math.max(0,+(document.getElementById('chB')?.value||0)),p=Math.max(0,+(document.getElementById('chP')?.value||0));document.getElementById('chDue').textContent='৳ '+toBn(Math.max(0,b-p))}
function sCh(did){var chNo=toEn(document.getElementById('chN')?.value||'').trim();var bill=Math.max(0,+(document.getElementById('chB')?.value||0));var paid=Math.max(0,+(document.getElementById('chP')?.value||0));if(!chNo){toast('warn','চালান নম্বর দিন');return}if(bill<=0){toast('warn','বিলের পরিমাণ দিন');return}var due=Math.max(0,bill-paid);var d=DB.dealers.find(function(x){return x.id===did});if(d){d.transactions.push({date:autoDate(),challanNo:chNo,totalBill:bill,paid:paid,due:due});DB.nxtCh++}saveDB();closeM('sub2Modal');oDD(did);renderDash();toast('ok','চালান সংরক্ষিত হয়েছে')}
function addDPF(did){setM('sub2Modal','<div class="m-head"><h3>পেমেন্ট</h3><button class="m-x" onclick="closeM(\'sub2Modal\')"><i class="fas fa-times"></i></button></div><div class="m-body"><div class="fg"><label>পেমেন্টের পরিমাণ</label><input type="number" id="dpA" placeholder="0" min="0"></div></div><div class="m-foot"><button class="mbtn mbtn-g" onclick="closeM(\'sub2Modal\')">বাতিল</button><button class="mbtn mbtn-gr" onclick="sDP('+did+')"><i class="fas fa-save"></i> সংরক্ষণ</button></div>');openM('sub2Modal')}
function sDP(did){var paid=Math.max(0,+(document.getElementById('dpA')?.value||0));if(paid<=0){toast('warn','পরিমাণ দিন');return}var d=DB.dealers.find(function(x){return x.id===did});if(d){d.transactions.push({date:autoDate(),challanNo:'পেমেন্ট',totalBill:0,paid:paid,due:0})}saveDB();closeM('sub2Modal');oDD(did);renderDash();toast('ok','পেমেন্ট সংরক্ষিত হয়েছে')}
function delDT(did,idx){var d=DB.dealers.find(function(x){return x.id===did});if(!d)return;d.transactions.splice(idx,1);saveDB();oDD(did);renderDash();toast('ok','লেনদেন মুছে ফেলা হয়েছে')}

/* ═══════════════ হিসাব সারাংশ ═══════════════ */
function initSUM(){var now=new Date();var cm=now.getMonth(),cy=now.getFullYear();var mOpts='';for(var i=0;i<12;i++){mOpts+='<option value="'+i+'"'+(i===cm?' selected':'')+'>'+MONTHS[i]+'</option>'}var yOpts='';for(var y=cy-2;y<=cy+1;y++){yOpts+='<option value="'+y+'"'+(y===cy?' selected':'')+'>'+toBn(y)+'</option>'}document.getElementById('pgSummary').innerHTML='<div class="panel"><div class="p-head"><h3><i class="fas fa-calculator"></i> মাসিক হিসাব</h3><div style="display:flex;gap:8px;align-items:center"><select id="sumM" onchange="renderSUM()" style="background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:13px;font-family:\'Hind Siliguri\',sans-serif;color:var(--tp);outline:none">'+mOpts+'</select><select id="sumY" onchange="renderSUM()" style="background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:13px;font-family:\'Hind Siliguri\',sans-serif;color:var(--tp);outline:none">'+yOpts+'</select></div></div><div class="p-body" id="sumBody"></div></div>';renderSUM()}
function renderSUM(){var m=+(document.getElementById('sumM').value),y=+(document.getElementById('sumY').value);var d=getMD(m,y);var net=d.ts-d.tc;var netClr=net>=0?'var(--grn)':'var(--red)';var h='<div class="sum-stat"><div class="sum-stat-item"><div class="ss-val" style="color:var(--grn)">৳ '+toBn(d.cs.toFixed(2))+'</div><div class="ss-lbl">নগদ বিক্রি</div></div><div class="sum-stat-item"><div class="ss-val" style="color:var(--org)">৳ '+toBn(d.cr.toFixed(2))+'</div><div class="ss-lbl">বাকি বিক্রি</div></div></div><div class="sum-stat"><div class="sum-stat-item"><div class="ss-val" style="color:var(--blu)">৳ '+toBn(d.ts.toFixed(2))+'</div><div class="ss-lbl">মোট বিক্রি</div></div><div class="sum-stat-item"><div class="ss-val" style="color:var(--grn)">৳ '+toBn(d.pf.toFixed(2))+'</div><div class="ss-lbl">মোট লাভ</div></div></div><div class="sum-stat"><div class="sum-stat-item"><div class="ss-val" style="color:var(--red)">৳ '+toBn(d.pc.toFixed(2))+'</div><div class="ss-lbl">মোট ক্রয়</div></div><div class="sum-stat-item"><div class="ss-val" style="color:var(--org)">৳ '+toBn(d.oe.toFixed(2))+'</div><div class="ss-lbl">অন্যান্য খরচ</div></div></div><div style="margin-top:16px;padding:16px;background:'+(net>=0?'var(--grn-l)':'var(--red-l)')+';border-radius:10px;text-align:center"><div style="font-size:12px;color:var(--tm);margin-bottom:4px">নিট আয়</div><div style="font-family:Space Grotesk,sans-serif;font-size:28px;font-weight:700;color:'+netClr+'">৳ '+toBn(net.toFixed(2))+'</div></div>';h+='<div style="margin-top:20px"><div class="p-head" style="padding:14px 18px;border-bottom:1px solid var(--bd)"><h3 style="font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px"><i class="fas fa-calendar-day" style="color:var(--blu);font-size:13px"></i> দৈনিক বিবরণ</h3></div><div style="overflow-x:auto"><table><thead><tr><th>তারিখ</th><th>নগদ বিক্রি</th><th>বাকি বিক্রি</th><th>মোট বিক্রি</th><th>খরচ</th><th>লাভ</th></tr></thead><tbody>';var dim=new Date(y,m+1,0).getDate();var tcs=0,tcr=0,tts=0,ttc=0,tpf=0;for(var day=1;day<=dim;day++){var ds=toBn(String(day).padStart(2,'0'))+'/'+toBn(String(m+1).padStart(2,'0'))+'/'+toBn(y);var dd=getDD(ds);if(dd.cs===0&&dd.cr===0&&dd.tc===0)continue;tcs+=dd.cs;tcr+=dd.cr;tts+=dd.cs+dd.cr;ttc+=dd.tc;tpf+=dd.pf;h+='<tr><td>'+esc(ds)+'</td><td class="t-num" style="color:var(--grn)">৳ '+toBn(dd.cs.toFixed(2))+'</td><td class="t-num" style="color:var(--org)">৳ '+toBn(dd.cr.toFixed(2))+'</td><td class="t-num">৳ '+toBn((dd.cs+dd.cr).toFixed(2))+'</td><td class="t-num" style="color:var(--red)">৳ '+toBn(dd.tc.toFixed(2))+'</td><td class="t-num" style="color:'+(dd.pf>=0?'var(--grn)':'var(--red)')+'">৳ '+toBn(dd.pf.toFixed(2))+'</td></tr>'}if(tcs===0&&tcr===0&&ttc===0){h+='<tr><td colspan="6" class="empty-msg">এই মাসে কোনো লেনদেন নেই</td></tr>'}else{h+='<tr style="font-weight:700;border-top:2px solid var(--bd)"><td>মোট</td><td class="t-num" style="color:var(--grn)">৳ '+toBn(tcs.toFixed(2))+'</td><td class="t-num" style="color:var(--org)">৳ '+toBn(tcr.toFixed(2))+'</td><td class="t-num">৳ '+toBn(tts.toFixed(2))+'</td><td class="t-num" style="color:var(--red)">৳ '+toBn(ttc.toFixed(2))+'</td><td class="t-num" style="color:'+(tpf>=0?'var(--grn)':'var(--red)')+'">৳ '+toBn(tpf.toFixed(2))+'</td></tr>'}h+='</tbody></table></div></div>';document.getElementById('sumBody').innerHTML=h}
/* ═══════════════ প্রাথমিক রেন্ডার ═══════════════ */
renderDash();
</script>
</body>
</html>
